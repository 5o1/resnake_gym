name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev,render,rl]"
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Full test suite
        run: pytest -q --cov=resnake_gym --cov-report=term --cov-fail-under=80
      - name: Build distributions
        run: python -m build
